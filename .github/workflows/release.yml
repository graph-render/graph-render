name: Release
# npm publishing uses trusted publishing (OIDC) — no NPM_TOKEN secret.
# GitHub tags/releases use the built-in github.token — no PAT secret.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/latest
    # Prevent running on the version-bump commit that semantic-release itself pushes
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required — semantic-release reads every commit since
          # the last release tag to determine the next version.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      # Trusted publishing requires npm CLI >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: HUSKY=0 yarn install

      - name: Build all packages
        run: yarn build

      # @semantic-release/npm exchanges the GitHub OIDC token (id-token: write)
      # for a short-lived npm publish token. Each package must list this repo +
      # release.yml + the `release` environment as its Trusted Publisher on npmjs.com.
      - name: Release versions and GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: ./node_modules/.bin/multi-semantic-release

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@graph-render'

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-packages.mjs
